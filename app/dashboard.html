<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denial worklist</title>
<style>
  :root {
    --paper: #F5F6F3; --ink: #1E2530; --muted: #6B7280; --rule: #D9DCD6; --row: #FFFFFF;
    --appeal: #0F6E64; --resubmit: #2A4B8D; --writeoff: #9A3B1E; --escalate: #9C6A00; --noop: #7A7F87; --ok: #1F7A3A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Source Sans 3", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: baseline; gap: 20px; padding: 22px 28px 14px; border-bottom: 1px solid var(--rule); }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header .env { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .counts { display: flex; gap: 18px; color: var(--muted); font-size: 13px; }
  .counts b { color: var(--ink); font-size: 18px; font-weight: 600; margin-right: 4px; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 12px 28px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  button, select { font: inherit; padding: 6px 12px; border: 1px solid var(--ink); background: var(--row); color: var(--ink); border-radius: 3px; cursor: pointer; }
  button:hover { background: #ECEEE9; }
  button.primary { background: var(--ink); color: #fff; }
  button.primary:hover { background: #333B48; }
  button.approve { border-color: var(--ok); color: var(--ok); }
  button.reject { border-color: var(--writeoff); color: var(--writeoff); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--resubmit); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { padding: 8px 28px 40px; max-width: 1180px; }
  .empty { padding: 60px 0; color: var(--muted); }
  .empty b { color: var(--ink); }
  .plan { display: grid; grid-template-columns: 150px 1fr auto; gap: 18px; align-items: start; background: var(--row); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; margin-top: 10px; }
  .stamp { display: inline-block; padding: 5px 9px; border: 2px solid var(--noop); color: var(--noop); border-radius: 3px; font-weight: 700; font-size: 14px; transform: rotate(-2deg); transform-origin: left center; }
  .stamp.appeal { border-color: var(--appeal); color: var(--appeal); }
  .stamp.correct_resubmit { border-color: var(--resubmit); color: var(--resubmit); }
  .stamp.write_off { border-color: var(--writeoff); color: var(--writeoff); }
  .stamp.escalate, .stamp.escalate_physician { border-color: var(--escalate); color: var(--escalate); }
  .stamp.close_duplicate, .stamp.patient_responsibility { border-color: var(--noop); color: var(--noop); }
  .who { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .reason { margin-top: 8px; max-width: 72ch; }
  .urgent { color: var(--writeoff); font-weight: 600; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--resubmit); font-size: 13px; }
  .trace { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  .trace li { margin: 2px 0; }
  pre { background: var(--paper); border: 1px solid var(--rule); padding: 10px 12px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; margin: 6px 0 0; max-width: 90ch; }
  .actions { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
  .state { font-size: 13px; color: var(--muted); }
  .state.executed { color: var(--ok); } .state.failed { color: var(--writeoff); } .state.rejected { color: var(--writeoff); }
  .steps { list-style: none; padding: 0; margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  .steps li::before { content: "·"; margin-right: 6px; }
  .steps li.done::before { content: "✓"; color: var(--ok); } .steps li.failed::before { content: "✕"; color: var(--writeoff); } .steps li.skipped::before { content: "–"; }
  @media (max-width: 760px) { .plan { grid-template-columns: 1fr; } .actions { flex-direction: row; flex-wrap: wrap; } }
  @media (prefers-reduced-motion: no-preference) { .plan.new { animation: in 320ms ease-out; } @keyframes in { from { background: #EAF4F1; } to { background: var(--row); } } }
</style>
</head>
<body>
<header>
  <h1>Denial worklist</h1>
  <span class="env" id="env">connecting…</span>
  <span class="spacer"></span>
  <div class="counts"><span><b id="c-await">0</b>awaiting approval</span><span><b id="c-done">0</b>executed</span><span><b id="c-esc">0</b>escalated</span><span><b id="c-fail">0</b>failed</span></div>
</header>
<div class="bar">
  <button class="primary" onclick="call('POST','/poll','Polled inbox')">Poll inbox</button>
  <button onclick="call('POST','/slack/poll-reactions','Applied Slack reactions')">Apply Slack reactions</button>
  <select id="fixture"></select>
  <button onclick="ingestFixture()">Ingest fixture</button>
  <button onclick="call('POST','/report/slack','Posted summary to Slack')">Post summary to Slack</button>
  <span id="status"></span>
</div>
<main id="list"><div class="empty"><b>No denials worked yet.</b> Poll the inbox, or ingest a fixture to see a plan.</div></main>
<script>
const $ = s => document.querySelector(s);
let seen = new Set();
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? {'content-type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(`${method} ${path}: ${r.status} ${await r.text()}`);
  return r.json();
}
function say(t) { $('#status').textContent = t + ' · ' + new Date().toLocaleTimeString(); }
async function call(method, path, label) { try { await api(method, path); say(label); await refresh(); } catch (e) { say(e.message); } }
async function ingestFixture() { const f = $('#fixture').value; await call('POST', `/ingest-fixture/${f}`, `Ingested ${f}`); }
async function decide(id, what) { await call('POST', `/plans/${id}/${what}`, `${what === 'approve' ? 'Approved' : 'Rejected'} ${id}`); }
function esc(s) { return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(v) { return v == null ? '' : '$' + Number(v).toLocaleString(undefined, {minimumFractionDigits: 2}); }
function render(plans) {
  const list = $('#list');
  if (!plans.length) return;
  plans.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
  const counts = {await: 0, done: 0, esc: 0, fail: 0};
  list.innerHTML = plans.map(p => {
    const d = p.decision, dn = p.denial;
    if (p.status === 'awaiting_approval') counts.await++;
    if (p.status === 'executed') counts.done++;
    if (p.status === 'failed') counts.fail++;
    if (d.type.startsWith('escalate')) counts.esc++;
    const isNew = !seen.has(p.plan_id); seen.add(p.plan_id);
    const stamp = d.type.replace(/_/g, ' ');
    const trace = (d.rule_trace || []).map(r => `<li>${esc(r)}</li>`).join('');
    const steps = (p.actions || []).map(a => `<li class="${a.status}">${a.type.replace(/_/g, ' ')}${a.attempts > 1 ? ` (${a.attempts} attempts)` : ''}${a.error ? ' — ' + esc(a.error) : ''}</li>`).join('');
    const deadline = d.appeal_deadline ? `deadline ${d.appeal_deadline}${d.days_to_deadline != null ? ` (${d.days_to_deadline} days)` : ''}` : '';
    const buttons = p.status === 'awaiting_approval'
      ? `<button class="approve" onclick="decide('${p.plan_id}','approve')">Approve and execute</button><button class="reject" onclick="decide('${p.plan_id}','reject')">Reject</button>`
      : '';
    return `<article class="plan ${isNew ? 'new' : ''}">
      <div><span class="stamp ${d.type}">${esc(stamp)}</span>${d.urgent ? '<div class="urgent">urgent</div>' : ''}</div>
      <div>
        <div class="who">${esc(dn.claim_id)} — ${esc(dn.patient_name)}</div>
        <div class="meta">${esc(dn.payer)} · ${esc(dn.carc)}${dn.rarc ? '/' + esc(dn.rarc) : ''} · ${money(dn.denied_amount)} denied · DOS ${esc(dn.dos || '')} ${deadline ? '· ' + deadline : ''}</div>
        <div class="reason">${esc(d.reason)}</div>
        ${trace ? `<details><summary>Rules that fired (${d.rule_trace.length})</summary><ol class="trace">${trace}</ol></details>` : ''}
        ${p.draft_text ? `<details><summary>${d.type === 'appeal' ? 'Appeal letter' : d.type === 'correct_resubmit' ? 'Resubmission cover' : 'Message to team'}</summary><pre>${esc(p.draft_text)}</pre></details>` : ''}
      </div>
      <div class="actions">
        <span class="state ${p.status}">${p.status.replace(/_/g, ' ')}</span>
        ${buttons}
        ${steps ? `<ul class="steps">${steps}</ul>` : ''}
      </div>
    </article>`;
  }).join('');
  $('#c-await').textContent = counts.await; $('#c-done').textContent = counts.done; $('#c-esc').textContent = counts.esc; $('#c-fail').textContent = counts.fail;
}
async function refresh() {
  try {
    const [h, plans] = await Promise.all([api('GET', '/health'), api('GET', '/plans?full=1')]);
    $('#env').textContent = `${h.tools} apps · ${h.llm} model · today ${h.today}`;
    render(plans);
  } catch (e) { $('#env').textContent = 'server unreachable'; }
}
(async () => {
  try { const fx = await api('GET', '/fixtures'); $('#fixture').innerHTML = fx.map(f => `<option>${f}</option>`).join(''); } catch (e) {}
  await refresh(); setInterval(refresh, 3000);
})();
</script>
</body>
</html>
